<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <g transform="translate(12, 10)" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Tree trunk -->
    <line x1="20" y1="44" x2="20" y2="26"/>
    <!-- Left branch -->
    <line x1="20" y1="30" x2="8" y2="18"/>
    <!-- Right branch -->
    <line x1="20" y1="30" x2="32" y2="18"/>
    <!-- Center top -->
    <line x1="20" y1="26" x2="20" y2="14"/>
    <!-- Person circles -->
    <circle cx="20" cy="10" r="4" fill="white" stroke="none"/>
    <circle cx="8" cy="14" r="3.5" fill="white" stroke="none"/>
    <circle cx="32" cy="14" r="3.5" fill="white" stroke="none"/>
    <circle cx="3" cy="8" r="2.5" fill="rgba(255,255,255,0.7)" stroke="none"/>
    <circle cx="13" cy="6" r="2.5" fill="rgba(255,255,255,0.7)" stroke="none"/>
    <circle cx="27" cy="6" r="2.5" fill="rgba(255,255,255,0.7)" stroke="none"/>
    <circle cx="37" cy="8" r="2.5" fill="rgba(255,255,255,0.7)" stroke="none"/>
    <!-- Sub branches -->
    <line x1="8" y1="18" x2="3" y2="12"/>
    <line x1="8" y1="18" x2="13" y2="10"/>
    <line x1="32" y1="18" x2="27" y2="10"/>
    <line x1="32" y1="18" x2="37" y2="12"/>
  </g>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#D4805A"/>
      <stop offset="100%" stop-color="#C06A3E"/>
    </linearGradient>
  </defs>
</svg>
